<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NASA APOD Gallery</title>
<style>
  :root { --nasa-blue: #0b3d91; --nasa-red: #fc3d21; --bg: #05070d; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: #fff; font-family: "Helvetica Neue", Arial, sans-serif; }
  header { background: var(--nasa-blue); padding: 1.5rem; text-align: center; border-bottom: 4px solid var(--nasa-red); }
  header h1 { margin: 0; letter-spacing: 0.15em; text-transform: uppercase; }
  main { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }
  .controls { display: flex; gap: 0.75rem; justify-content: center; align-items: center; flex-wrap: wrap; margin-bottom: 1rem; }
  .controls input, .controls button { padding: 0.5rem 0.75rem; font-size: 1rem; border-radius: 4px; border: 1px solid var(--nasa-blue); }
  .controls button { background: var(--nasa-red); color: #fff; border: none; cursor: pointer; }
  #fact { background: #101830; border-left: 4px solid var(--nasa-red); padding: 1rem; margin-bottom: 1.5rem; }
  #loading { text-align: center; font-size: 1.2rem; padding: 2rem; }
  #gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
  .item { background: #101830; border-radius: 6px; overflow: hidden; cursor: pointer; }
  .thumb { height: 200px; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #000; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
  .item:hover .thumb img { transform: scale(1.12); }
  .video-thumb { padding: 1rem; text-align: center; color: #9db8ff; }
  .item .meta { padding: 0.75rem; }
  .item h3 { margin: 0 0 0.25rem; font-size: 1rem; }
  .item time { color: #9db8ff; font-size: 0.85rem; }
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; padding: 1rem; z-index: 10; }
  #modal.open { display: flex; }
  .modal-box { background: #101830; max-width: 900px; max-height: 95vh; overflow-y: auto; border-radius: 8px; padding: 1rem; position: relative; }
  .modal-box img, .modal-box iframe { width: 100%; border-radius: 4px; }
  .modal-box iframe { aspect-ratio: 16/9; border: 0; }
  #close { position: absolute; top: 0.5rem; right: 0.75rem; background: var(--nasa-red); border: none; color: #fff; font-size: 1.2rem; border-radius: 4px; cursor: pointer; }
  .error { color: #ff8a7a; text-align: center; }
</style>
</head>
<body>
<header><h1>NASA Astronomy Picture of the Day</h1></header>
<main>
  <div class="controls">
    <label for="start">Start date:</label>
    <input type="date" id="start" min="1995-06-16">
    <button id="load">Load 9 days</button>
  </div>
  <div id="fact"></div>
  <div id="loading" hidden>Loading images from NASA...</div>
  <div id="error" class="error"></div>
  <div id="gallery"></div>
</main>

<div id="modal" role="dialog" aria-modal="true">
  <div class="modal-box">
    <button id="close" aria-label="Close">&times;</button>
    <div id="modal-media"></div>
    <h2 id="modal-title"></h2>
    <time id="modal-date"></time>
    <p id="modal-text"></p>
  </div>
</div>

<script>
const API_KEY = "DEMO_KEY"; // Replace with your own key from api.nasa.gov
const DAYS = 9;
const FACTS = [
  "A day on Venus is longer than a year on Venus.",
  "Neutron stars can spin over 600 times per second.",
  "Light from the Sun takes about 8 minutes to reach Earth.",
  "Jupiter's Great Red Spot is a storm larger than Earth.",
  "There are more stars in the universe than grains of sand on Earth's beaches.",
  "Footprints on the Moon can last millions of years."
];

const $ = id => document.getElementById(id);
const fmt = d => d.toISOString().slice(0, 10);

function addDays(date, n) {
  const d = new Date(date + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate() + n);
  return d;
}

function youtubeEmbed(url) {
  try {
    const u = new URL(url);
    if (u.hostname.includes("youtube.com") && u.pathname.startsWith("/embed/")) return url;
  } catch {}
  return null;
}

async function loadGallery() {
  const start = $("start").value;
  const gallery = $("gallery");
  gallery.innerHTML = "";
  $("error").textContent = "";
  $("loading").hidden = false;
  try {
    const url = `https://api.nasa.gov/planetary/apod?api_key=${API_KEY}&start_date=${start}&end_date=${fmt(addDays(start, DAYS - 1))}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`NASA API error (${res.status})`);
    const data = (await res.json()).sort((a, b) => b.date.localeCompare(a.date));
    data.forEach(entry => gallery.appendChild(createItem(entry)));
  } catch (e) {
    $("error").textContent = e.message;
  } finally {
    $("loading").hidden = true;
  }
}

function createItem(entry) {
  const el = document.createElement("div");
  el.className = "item";
  el.tabIndex = 0;
  const thumb = document.createElement("div");
  thumb.className = "thumb";
  if (entry.media_type === "image") {
    const img = document.createElement("img");
    img.src = entry.url;
    img.alt = entry.title;
    img.loading = "lazy";
    thumb.appendChild(img);
  } else if (entry.thumbnail_url) {
    const img = document.createElement("img");
    img.src = entry.thumbnail_url;
    img.alt = entry.title + " (video)";
    thumb.appendChild(img);
  } else {
    thumb.innerHTML = '<div class="video-thumb">&#9654; Video</div>';
  }
  const meta = document.createElement("div");
  meta.className = "meta";
  const h = document.createElement("h3");
  h.textContent = entry.title;
  const t = document.createElement("time");
  t.textContent = entry.date;
  meta.append(h, t);
  el.append(thumb, meta);
  el.addEventListener("click", () => openModal(entry));
  el.addEventListener("keydown", e => { if (e.key === "Enter") openModal(entry); });
  return el;
}

function openModal(entry) {
  const media = $("modal-media");
  media.innerHTML = "";
  if (entry.media_type === "image") {
    const img = document.createElement("img");
    img.src = entry.hdurl || entry.url;
    img.alt = entry.title;
    media.appendChild(img);
  } else {
    const embed = youtubeEmbed(entry.url);
    if (embed) {
      const f = document.createElement("iframe");
      f.src = embed;
      f.allowFullscreen = true;
      f.title = entry.title;
      media.appendChild(f);
    } else {
      const a = document.createElement("a");
      a.href = entry.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = "Watch video";
      a.style.color = "#9db8ff";
      media.appendChild(a);
    }
  }
  $("modal-title").textContent = entry.title;
  $("modal-date").textContent = entry.date;
  $("modal-text").textContent = entry.explanation;
  $("modal").classList.add("open");
}

function closeModal() {
  $("modal").classList.remove("open");
  $("modal-media").innerHTML = "";
}

$("close").addEventListener("click", closeModal);
$("modal").addEventListener("click", e => { if (e.target === $("modal")) closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
$("load").addEventListener("click", () => $("start").value && loadGallery());

$("fact").textContent = "Did you know? " + FACTS[Math.floor(Math.random() * FACTS.length)];
const today = new Date();
$("start").max = fmt(today);
$("start").value = fmt(addDays(fmt(today), -(DAYS - 1)));
loadGallery();
</script>
</body>
</html>
