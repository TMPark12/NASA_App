<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NASA Astronomy Picture of the Day Gallery</title>
<meta name="description" content="Browse nine days of NASA Astronomy Pictures of the Day with titles, dates and full explanations.">
<meta name="theme-color" content="#0b3d91">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NASA Explorer">
</head>
<body>
<a class="skip-link" href="#gallery">Skip to gallery</a>
<header><h1>NASA Astronomy Picture of the Day</h1></header>
<main id="main">
  <div class="date-toolbar">
    <form class="controls" id="controls">
      <label for="start">Latest date:</label>
      <input type="date" id="start" min="1995-06-16" required>
      <label for="end-date">End date:</label>
      <output id="end-date" class="date-display" aria-live="polite"></output>
      <button type="submit" id="load">Load 9 days</button>
      <div class="install-controls">
        <button type="button" id="install-app" class="install-button">Save Me For Later</button>
        <p id="install-status" role="status" aria-live="polite"></p>
      </div>
    </form>
  </div>
  <p class="date-note">Pictures are listed newest to oldest. The end date is the oldest date in the range, up to 9 days inclusive. NASA's archive begins June 16, 1995.</p>
  <aside id="fact" aria-label="Did you know?"></aside>
  <div id="loading" role="status" hidden>Beaming data in, please wait...</div>
  <div id="error" class="error" role="alert"></div>
  <ul id="gallery" aria-label="Astronomy pictures of the day" tabindex="-1"></ul>
</main>

<div id="modal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="modal-title" aria-describedby="modal-text">
  <div class="modal-box">
    <button type="button" id="close" aria-label="Close dialog"><span aria-hidden="true">&times;</span></button>
    <div id="modal-media"></div>
    <h2 id="modal-title"></h2>
    <time id="modal-date"></time>
    <p id="modal-text"></p>
    <p id="modal-error" class="error" role="alert"></p>
    <div class="modal-nav">
      <button type="button" id="back" class="nav-btn">&larr; Back to gallery</button>
      <button type="button" id="next" class="nav-btn">Next (previous day) &rarr;</button>
    </div>
  </div>
</div>

<script>
const API_KEY = "mpk8rTfbF8jh7hDHkpK8MNGcwFcHNccLcRR868T8";
const DAYS = 9;
const SCIENCE_FEED = "https://science.nasa.gov/wp-json/wp/v2/apod-basic";
const FEED_PAGE_SIZE = 25;

const $ = id => document.getElementById(id);
const fmt = d => d.toISOString().slice(0, 10);
const MIN_DATE = "1995-06-16";

function formatUsDate(isoDate) {
  const [year, month, day] = isoDate.split("-");
  return `${month}/${day}/${year}`;
}

function addDays(date, n) {
  const d = new Date(date + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate() + n);
  return d;
}

function earliestDate(latest) {
  const date = fmt(addDays(latest, -(DAYS - 1)));
  return date < MIN_DATE ? MIN_DATE : date;
}

function updateEndDate() {
  const latest = $("start").value;
  $("end-date").textContent = latest ? formatUsDate(earliestDate(latest)) : "";
}

function youtubeEmbed(url) {
  try {
    const u = new URL(url);
    if (u.hostname.includes("youtube.com") && u.pathname.startsWith("/embed/")) return url;
  } catch {}
  return null;
}

const isPlaceholder = e => e.title === "NASA Science" || /nasa-logo/.test(e.url || "");

const stripHtml = html => new DOMParser().parseFromString(html || "", "text/html").body.textContent.trim();

// The science.nasa.gov feed has no date filter, so page through it (newest first) until the range is covered.
async function fetchScienceFeed(latest, earliest) {
  const byDate = {};
  const daysAgo = Math.floor((Date.now() - new Date(latest + "T00:00:00Z")) / 864e5);
  let page = Math.max(1, Math.floor(daysAgo / FEED_PAGE_SIZE) + 1);
  const seen = new Set();
  while (page >= 1 && !seen.has(page) && seen.size < 8) {
    seen.add(page);
    const res = await fetch(`${SCIENCE_FEED}?per_page=${FEED_PAGE_SIZE}&page=${page}`);
    if (!res.ok) throw new Error(`NASA Science feed error (${res.status})`);
    const items = await res.json();
    if (!items.length) break;
    items.forEach(e => { byDate[e.date] = e; });
    if (items[0].date < latest) page--;
    else if (items[items.length - 1].date > earliest) page++;
    else break;
  }
  return byDate;
}

async function replacePlaceholders(data, latest, earliest) {
  if (!data.some(isPlaceholder)) return data;
  try {
    const feed = await fetchScienceFeed(latest, earliest);
    return data.map(e => {
      const f = feed[e.date];
      if (!isPlaceholder(e) || !f || !f.hdurl) return e;
      return { ...e, title: f.title, media_type: f.media_type, url: f.url, hdurl: f.hdurl, alt: f.alt, explanation: stripHtml(f.explanation) };
    });
  } catch (error) {
    console.warn("Unable to replace placeholder pictures:", error);
    return data;
  }
}

let galleryRequest = 0;

async function loadGallery() {
  const latest = $("start").value;
  if (!latest) return;
  const request = ++galleryRequest;
  const earliest = earliestDate(latest);
  const gallery = $("gallery");
  gallery.innerHTML = "";
  $("error").replaceChildren();
  $("loading").hidden = false;
  try {
    const url = `https://api.nasa.gov/planetary/apod?api_key=${API_KEY}&start_date=${earliest}&end_date=${latest}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error("Unable to load astronomy pictures.");
    const results = await res.json();
    if (!Array.isArray(results) || results.length === 0) throw new Error("No astronomy pictures were found for those dates.");
    if (!results.every(entry => entry && typeof entry.date === "string" && entry.date >= earliest && entry.date <= latest)) {
      throw new Error("NASA returned pictures outside the selected date range.");
    }
    const sorted = results.sort((a, b) => b.date.localeCompare(a.date));
    const data = await replacePlaceholders(sorted, latest, earliest);
    if (request !== galleryRequest) return;
    data.forEach(entry => { cache[entry.date] = entry; gallery.appendChild(createItem(entry)); });
  } catch (error) {
    if (request === galleryRequest) {
      console.error("Unable to load astronomy pictures:", error);
      showRecoveryMessage($("error"), "Sorry, we couldn't find the astronomy pictures for those dates.");
    }
  } finally {
    if (request === galleryRequest) $("loading").hidden = true;
  }
}

function showRecoveryMessage(container, message) {
  const refresh = document.createElement("button");
  refresh.type = "button";
  refresh.className = "refresh-button";
  refresh.textContent = "Refresh page";
  refresh.addEventListener("click", () => window.location.reload());
  container.replaceChildren(
    document.createTextNode(`${message} Please refresh the page or try a different date. `),
    refresh
  );
}

const cache = {};

async function fetchEntry(date) {
  if (cache[date]) return cache[date];
  const res = await fetch(`https://api.nasa.gov/planetary/apod?api_key=${API_KEY}&date=${date}`);
  if (!res.ok) throw new Error("Unable to load astronomy picture.");
  const result = await res.json();
  if (!result || result.date !== date) throw new Error("NASA returned an unexpected astronomy picture date.");
  const [entry] = await replacePlaceholders([result], date, date);
  return (cache[date] = entry);
}

const hasPrevious = date => fmt(addDays(date, -1)) >= MIN_DATE;

async function showNext() {
  const date = fmt(addDays(current.date, -1));
  if (!hasPrevious(current.date)) return;
  const request = ++modalRequest;
  $("next").disabled = true;
  $("modal-error").textContent = "";
  try {
    const entry = await fetchEntry(date);
    if (request === modalRequest) showEntry(entry);
  } catch (error) {
    if (request === modalRequest) {
      console.error("Unable to load astronomy picture:", error);
      showRecoveryMessage($("modal-error"), "Sorry, we couldn't find information for that date.");
    }
  } finally {
    if (request === modalRequest) {
      $("next").disabled = !hasPrevious(current.date);
      if (!$("next").disabled) $("next").focus(); else $("back").focus();
    }
  }
}

function createItem(entry) {
  const el = document.createElement("li");
  el.className = "item";
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "item-btn";
  btn.setAttribute("aria-haspopup", "dialog");
  const thumb = document.createElement("div");
  thumb.className = "thumb";
  if (entry.media_type === "image") {
    const img = document.createElement("img");
    img.src = entry.hdurl || entry.url;
    img.alt = entry.alt || entry.title;
    img.width = 400;
    img.height = 200;
    img.loading = "lazy";
    img.decoding = "async";
    thumb.appendChild(img);
  } else if (entry.thumbnail_url) {
    const img = document.createElement("img");
    img.src = entry.thumbnail_url;
    img.alt = entry.title + " (video thumbnail)";
    thumb.appendChild(img);
  } else {
    thumb.innerHTML = '<div class="video-thumb"><span aria-hidden="true">&#9654;</span> Video</div>';
  }
  const meta = document.createElement("div");
  meta.className = "meta";
  const h = document.createElement("h3");
  h.textContent = entry.title;
  const t = document.createElement("time");
  t.textContent = entry.date;
  meta.append(h, t);
  btn.append(thumb, meta);
  btn.addEventListener("click", () => openModal(entry, btn));
  el.appendChild(btn);
  return el;
}

let lastFocus = null;
let current = null;
let modalRequest = 0;

function openModal(entry, trigger) {
  modalRequest++;
  lastFocus = trigger || document.activeElement;
  showEntry(entry);
  $("modal").classList.add("open");
  $("modal").setAttribute("aria-hidden", "false");
  document.body.classList.add("modal-open");
  $("close").focus();
}

function showEntry(entry) {
  current = entry;
  $("modal-error").textContent = "";
  const media = $("modal-media");
  media.innerHTML = "";
  if (entry.media_type === "image") {
    const img = document.createElement("img");
    img.src = entry.hdurl || entry.url;
    img.alt = entry.alt || entry.title;
    media.appendChild(img);
  } else {
    const embed = youtubeEmbed(entry.url);
    if (embed) {
      const f = document.createElement("iframe");
      f.src = embed;
      f.allowFullscreen = true;
      f.title = entry.title;
      media.appendChild(f);
    } else {
      const a = document.createElement("a");
      a.href = entry.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = "Watch video (opens in a new tab)";
      a.style.color = "#9db8ff";
      media.appendChild(a);
    }
  }
  $("modal-title").textContent = entry.title;
  $("modal-date").textContent = entry.date;
  $("modal-text").textContent = entry.explanation;
  $("modal").querySelector(".modal-box").scrollTop = 0;
  $("next").disabled = !hasPrevious(entry.date);
}

function closeModal() {
  modalRequest++;
  $("modal").classList.remove("open");
  $("modal").setAttribute("aria-hidden", "true");
  $("modal-media").innerHTML = "";
  document.body.classList.remove("modal-open");
  if (lastFocus) lastFocus.focus();
}

$("close").addEventListener("click", closeModal);
$("back").addEventListener("click", closeModal);
$("next").addEventListener("click", showNext);
$("modal").addEventListener("click", e => { if (e.target === $("modal")) closeModal(); });
document.addEventListener("keydown", e => {
  const open = $("modal").classList.contains("open");
  if (!open) return;
  if (e.key === "Escape") return closeModal();
  if (e.key === "Tab") {
    const f = [...$("modal").querySelectorAll("a[href], button:not(:disabled), iframe")];
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});
$("start").addEventListener("input", () => {
  galleryRequest++;
  $("gallery").replaceChildren();
  $("error").replaceChildren();
  $("loading").hidden = true;
  updateEndDate();
});
function loadSelectedDate() {
  $("start").max = fmt(new Date());
  if ($("controls").reportValidity()) loadGallery();
}
$("start").addEventListener("change", loadSelectedDate);
$("controls").addEventListener("submit", e => {
  e.preventDefault();
  loadSelectedDate();
});

let installPrompt = null;
let installedThisSession = false;
const installButton = $("install-app");
const installStatus = $("install-status");
const appDisplayModes = ["standalone", "minimal-ui", "fullscreen"]
  .map(mode => window.matchMedia(`(display-mode: ${mode})`));
const isRunningAsApp = () => navigator.standalone === true || appDisplayModes.some(mode => mode.matches);

window.addEventListener("beforeinstallprompt", event => {
  event.preventDefault();
  installPrompt = event;
});

window.addEventListener("appinstalled", () => {
  installPrompt = null;
  installedThisSession = true;
  installStatus.textContent = "NASA Explorer has been installed.";
});

installButton.addEventListener("click", async () => {
  installStatus.textContent = "";
  if (isRunningAsApp() || installedThisSession) {
    installStatus.textContent = "NASA Explorer is already installed.";
    return;
  }
  if (!installPrompt) {
    installStatus.textContent = /iPad|iPhone|iPod/.test(navigator.userAgent)
      ? "To add NASA Explorer, tap Share, then choose Add to Home Screen."
      : "To add NASA Explorer, use your browser's Install or Add to Home Screen option.";
    return;
  }

  const prompt = installPrompt;
  installPrompt = null;
  try {
    await prompt.prompt();
    const { outcome } = await prompt.userChoice;
    if (outcome === "accepted") {
      if (!installedThisSession) installStatus.textContent = "Installation accepted. Follow your browser's instructions to finish.";
    }
  } catch (error) {
    console.error("Unable to open the app install prompt:", error);
    installStatus.textContent = "The install prompt could not be opened. Try your browser's Install or Add to Home Screen option.";
  }
});

async function showFact() {
  try {
    const res = await fetch("facts.json");
    if (!res.ok) throw new Error(`Facts error (${res.status})`);
    const facts = await res.json();
    $("fact").textContent = "Did you know? " + facts[Math.floor(Math.random() * facts.length)];
  } catch (error) {
    console.error("Unable to load astronomy facts:", error);
    $("fact").hidden = true;
  }
}

showFact();
const today = new Date();
$("start").max = fmt(today);
$("start").value = fmt(today);
updateEndDate();
loadGallery();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js")
      .catch(error => console.error("Service worker registration failed:", error));
  });
}
</script>
</body>
</html>
